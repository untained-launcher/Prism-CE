name: Build

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/upstream-sync-base'
  workflow_dispatch:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration: CI, Release, or Beta'
        required: false
        default: CI
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      configuration: ${{ steps.vars.outputs.configuration }}
    steps:
      - name: Resolve configuration
        id: vars
        env:
          REQUESTED: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          config="${REQUESTED:-CI}"
          case "$config" in
            CI|Release|Beta) ;;
            *) echo "::error::Unsupported configuration: $config"; exit 1 ;;
          esac
          echo "configuration=$config" >> "$GITHUB_OUTPUT"

  policy:
    name: Policy guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check forbidden content and anonymity trailers
        env:
          SYNC_GIT_EMAIL: ${{ vars.SYNC_GIT_EMAIL }}
        run: |
          set -o pipefail
          ./scripts/check-policy.sh 2>&1 | tee policy.log

      - name: Upload policy log
        if: always() && hashFiles('policy.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-log
          path: policy.log
          retention-days: 7

  build:
    name: Build (${{ matrix.configuration }} / ${{ matrix.architecture }})
    needs: [policy, prepare]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: ${{ needs.prepare.outputs.configuration }}
            architecture: x64
          - configuration: ${{ needs.prepare.outputs.configuration }}
            architecture: ARM64
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Describe
        run: |
          describe="$(git describe --tags --always)"
          echo "describe=$describe" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=${{ matrix.configuration }} \
            -p:Platform=${{ matrix.architecture }} \
            -p:DeleteExistingFiles=true -o ./artifact --no-self-contained \
            2>&1 | tee "build-${{ matrix.architecture }}.log"

      - name: Upload build log
        if: always() && hashFiles(format('build-{0}.log', matrix.architecture)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.architecture }}
          path: build-${{ matrix.architecture }}.log
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: artifact/**

  report:
    name: Report failure
    needs: [prepare, policy, build]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: '*log*'
          path: logs
          merge-multiple: true

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          {
            echo "## 自动构建失败"
            echo
            echo "- 运行：$RUN_URL"
            echo "- 提交：\`$SHA\`"
            echo "- 事件：\`$EVENT\`"
            echo "- 分支：\`$REF_NAME\`"
            echo "- 准备：\`$PREPARE_RESULT\`；策略检查：\`$POLICY_RESULT\`；构建：\`$BUILD_RESULT\`"
            echo
            echo "### 失败任务"
            gh run view "$RUN_ID" --repo "$REPO" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' 2>/dev/null \
              || echo "- （无法获取任务列表）"
            echo
            echo "### 日志摘录"
            echo '```text'
            if compgen -G "logs/build-*.log" >/dev/null; then
              cat logs/build-*.log | tail -c 40000
            elif [[ "$POLICY_RESULT" == "failure" ]] && compgen -G "logs/policy.log" >/dev/null; then
              cat logs/policy.log | tail -c 40000
            else
              gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -c 40000 \
                || echo "（无法获取日志，请打开运行页面）"
            fi
            echo
            echo '```'
            echo
            echo "> 本 Issue 由 CI 自动创建 / 更新；请勿在其中粘贴个人信息。"
          } > report.md

          num="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "[CI] 构建失败")][0].number // empty')"
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --repo "$REPO" --body-file report.md
          else
            gh issue create --repo "$REPO" --title "[CI] 构建失败" --body-file report.md
          fi
