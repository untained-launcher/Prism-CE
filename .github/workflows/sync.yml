name: Sync upstream

# 需要仓库 Settings -> Actions -> General -> Workflow permissions 允许读写，
# 并允许 GitHub Actions 推送到 dev；schedule 只会在默认分支上运行。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        id: sync
        env:
          SYNC_GIT_NAME: ${{ vars.SYNC_GIT_NAME }}
          SYNC_GIT_EMAIL: ${{ vars.SYNC_GIT_EMAIL }}
        run: |
          set -o pipefail
          ./scripts/sync-upstream.sh 2>&1 | tee sync.log

      - name: Trigger build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref dev

      - name: Create or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "## 上游同步失败"
            echo
            echo "- 运行：$RUN_URL"
            echo "- 同步前提交：\`$SHA\`"
            echo "- 上游：\`PCL-Community/PCL-CE@dev\`"
            echo
            echo "### 同步日志"
            echo '```text'
            tail -c 40000 sync.log 2>/dev/null || echo "（无日志；失败可能发生在 checkout 阶段）"
            echo
            echo '```'
            echo
            echo "> 本 Issue 由 CI 自动创建 / 更新。同步脚本失败时不会推送任何提交；"
            echo "> 若为 cherry-pick 冲突，请人工处理，注意不要引入被剔除的提交。"
            echo "> 若下方日志没有错误，失败可能发生在触发构建步骤；请打开运行页面查看。"
          } > report.md

          num="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "[CI] 上游同步失败")][0].number // empty')"
          if [[ -n "$num" ]]; then
            gh issue comment "$num" --repo "$REPO" --body-file report.md
          else
            gh issue create --repo "$REPO" --title "[CI] 上游同步失败" --body-file report.md
          fi
